name: opencode-review
description: >
  Single-responsibility adapter: run the read-only OpenCode reviewer over a
  pull-request diff and post the answer as a GitHub review. All logic lives in
  the co-located scripts/review.sh so it stays runnable outside Actions; this
  action only injects configuration via env (dependency inversion).
  Advisory: a missing secret or a model failure is an annotation, never a red
  check.

inputs:
  model:
    description: >
      OpenCode model selector (provider/model). Empty reviews with the free
      opencode/big-pickle, which needs no API key.
    required: false
    default: ''
  pr-number:
    description: Pull-request number the review is posted to.
    required: true
  base-sha:
    description: Base commit of the pull request (merge-base side of `base...head`).
    required: true
  head-sha:
    description: Head commit being reviewed; also the review's commit_id.
    required: true
  max-diff-chars:
    description: Cap on the diff bytes sent to the model (cost and context guard).
    required: false
    default: '120000'

runs:
  using: composite
  steps:
    - run: bash "${ACTION_PATH}/scripts/review.sh"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        # GH_TOKEN and OPENCODE_API_KEY arrive from the caller step's env so this
        # action never has to know how the workflow stores secrets.
