name: setup-node-deps
description: >
  Single-responsibility adapter: provision Node and install npm dependencies
  for one JS workspace. Workflows depend on this abstraction instead of
  repeating setup-node + npm ci steps (DRY).

inputs:
  node-version:
    description: Node major version to install.
    required: false
    default: '20'
  working-directory:
    description: JS workspace directory (e.g. frontend, e2e).
    required: false
    default: frontend
  cache-dependency-path:
    description: Lockfile path used for the setup-node cache key.
    required: false
    default: frontend/package-lock.json

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
