name: ci

on:
  push:
    # 'features/**' is listed next to 'feature/**' because working branches are named
    # features/<topic> — without it a push there starts no run at all.
    branches: [main, develop, 'feature/**', 'features/**']
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: changes (backend / frontend / e2e)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR file list through the API
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
              # The e2e job boots the stack from this file — a change to it (ports,
              # healthchecks, services) can break the suite without touching e2e/**.
              - 'compose.yaml'
              - '.github/workflows/ci.yml'

  backend:
    name: backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests (Testcontainers PostgreSQL)
        run: mvn -f backend/pom.xml test

  frontend-unit:
    name: frontend (npm run test:unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: 'e2e (compose profile: stack + Playwright)'
    runs-on: ubuntu-latest
    needs: changes
    # E2E is the slowest, most expensive feedback: run it only when a layer under test
    # moved — or when the suite / the stack / this workflow changed. A job skipped by `if`
    # reports "Success", so this stays compatible with required status checks.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true'
    timeout-minutes: 30
    # Everything this job needs is already declared — once — in compose.yaml: the stack
    # under test *and* the suite that drives it.
    #   postgres ──healthy──▶ backend ──healthy──▶ frontend ──healthy──▶ e2e (Playwright)
    # The `e2e` service (profiles: ["e2e"]) runs `npm ci && npm test` in the Playwright
    # image and reaches the SPA at http://frontend:4173, so the runner installs neither
    # Node, Java nor browsers and this job stays one compose command. That command is also
    # the documented local run (e2e/README.md §Run), so CI cannot drift from the stack a
    # developer uses — and a change to compose.yaml is itself an e2e trigger (see the
    # `changes` job filters above).
    env:
      # compose.yaml interpolates ${DB_PASSWORD:?…} — fail-fast by design, so the
      # throwaway CI value lives here. Nothing else is needed: every container reads its
      # configuration from compose, not from the runner's environment.
      DB_PASSWORD: ci-e2e-password # ephemeral compose stack, never a real secret
    steps:
      - uses: actions/checkout@v4

      - name: 'Run the suite (compose: postgres + backend + frontend + Playwright)'
        # Attached on purpose: every container's log streams into the job output (backend
        # boot, Vite, the Playwright list reporter), `--exit-code-from e2e` makes this step
        # adopt the Playwright container's exit code, and `--abort-on-container-exit` stops
        # the rest of the stack as soon as the suite is over. The healthcheck chain in
        # compose.yaml (depends_on: condition: service_healthy) is what sequences the
        # boot, so no runner-side waiting is needed here.
        run: docker compose --profile e2e up --abort-on-container-exit --exit-code-from e2e

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          # The Playwright container writes these into the bind-mounted ./e2e: the Allure
          # HTML report, its raw results, and the traces/screenshots of every failed
          # test — enough to debug a red run without a rerun.
          path: |
            e2e/allure-report
            e2e/allure-results
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        # The suite's exit already stopped the containers (--abort-on-container-exit);
        # this releases them and their volumes even when the step above failed before the
        # stack was up, so a red run never leaves the runner holding :8080 / :4173.
        if: ${{ always() }}
        run: docker compose --profile e2e down -v --remove-orphans
