name: ci

# Composition root: triggers + path-gated fan-out only. No `run:` steps here —
# each job delegates to one reusable workflow (single responsibility), so adding
# a new check means adding a new reusable file, not editing this orchestrator
# (open/closed). A job skipped by `if` reports Success, keeping required
# status checks green when its bounded context did not move.
on:
  push:
    # 'features/**' is listed next to 'feature/**' because working branches are named
    # features/<topic> — without it a push there starts no run at all.
    branches: [main, develop, 'feature/**', 'features/**']
  pull_request:
    branches: [main, develop]
  # Manual re-runs and branch debugging without an empty push.
  workflow_dispatch:

permissions:
  # Ceiling for the whole chain: reusable jobs may only keep or reduce these
  # (GitHub rejects a nested job that requests more). Each reusable declares
  # its own subset; pull-requests:read exists for the changes detector, which
  # reads the PR file list through the API.
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: a merge-queue/dispatch validation mid-flight must finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guards:
    name: guards
    uses: ./.github/workflows/reusable-guards.yml

  changes:
    name: changes
    needs: guards
    uses: ./.github/workflows/reusable-changes.yml

  backend:
    name: backend
    needs: changes
    # Backend suite is containerized (Testcontainers): run it when backend code
    # moved, or when the stack under it moved.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.stack == 'true'
    uses: ./.github/workflows/reusable-backend.yml

  frontend-unit:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.stack == 'true'
    uses: ./.github/workflows/reusable-frontend.yml

  k8s:
    name: k8s
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    uses: ./.github/workflows/reusable-k8s.yml

  e2e:
    name: e2e
    needs: changes
    # E2E is the slowest, most expensive feedback: run it when a layer under test
    # moved, the suite itself changed, or the stack under it changed. An e2e-only
    # edit no longer drags backend/frontend along (stack flag split them apart).
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.stack == 'true'
    uses: ./.github/workflows/reusable-e2e.yml
