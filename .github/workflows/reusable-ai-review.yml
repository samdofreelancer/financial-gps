name: reusable-ai-review
# Use case: advisory AI review of a pull request. Renders `base...head` for the
# first review and `lastReviewed...head` afterwards, asks the read-only OpenCode
# `review` agent for findings, and posts them as one GitHub review per commit.
#
# Contract:
#   - never blocks a merge (job is continue-on-error, script always exits 0);
#   - same-repo PRs only (the caller gates forks: their token is read-only, so a
#     review could not be posted, and fork code must never see the model key);
#   - no OPENCODE_API_KEY required: the default model is free. The secret only
#     matters when OPENCODE_REVIEW_MODEL names a paid provider.
on:
  workflow_call:
    inputs:
      model:
        description: >
          OpenCode model selector (provider/model). Empty reviews with the free
          opencode/big-pickle, which needs no key.
        required: false
        type: string
        default: ''
      pr-number:
        description: Pull-request number.
        required: true
        type: string
      base-sha:
        description: Base commit of the pull request.
        required: true
        type: string
      head-sha:
        description: Head commit under review.
        required: true
        type: string
      max-diff-chars:
        description: Cap on the diff bytes sent to the model.
        required: false
        type: string
        default: '120000'
    secrets:
      opencode-api-key:
        description: >
          Optional. Absent means the review runs on a free model; set it only to
          use a paid provider (with OPENCODE_REVIEW_MODEL).
        required: false

jobs:
  review:
    name: 'ai review (opencode, advisory)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory by design: a model outage, a rate limit or an unpostable review
    # must never turn a green PR red. Findings are a first pass for a human.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # post the review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The diff runs from the PR base — or from the last reviewed commit on a
          # later push — to head, so both ends must exist locally.
          fetch-depth: 0

      - uses: ./.github/actions/opencode-review
        with:
          model: ${{ inputs.model }}
          pr-number: ${{ inputs.pr-number }}
          base-sha: ${{ inputs.base-sha }}
          head-sha: ${{ inputs.head-sha }}
          max-diff-chars: ${{ inputs.max-diff-chars }}
        env:
          OPENCODE_API_KEY: ${{ secrets.opencode-api-key }}
          GH_TOKEN: ${{ github.token }}
