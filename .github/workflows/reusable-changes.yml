name: reusable-changes
# Use case: detect which bounded contexts moved. Single output contract that
# every consumer depends on (interface segregation: three booleans, nothing else).
on:
  workflow_call:
    outputs:
      backend:
        description: "'true' when backend/** moved."
        value: ${{ jobs.filter.outputs.backend }}
      frontend:
        description: "'true' when frontend/** moved."
        value: ${{ jobs.filter.outputs.frontend }}
      e2e:
        description: "'true' when the e2e suite or the stack under it moved."
        value: ${{ jobs.filter.outputs.e2e }}

jobs:
  filter:
    name: changes (backend / frontend / e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR file list through the API
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'frontend/nginx.conf'
              - 'compose.yaml'
              - 'compose.override.yaml'
              - 'compose.ci.yaml'
              # The e2e job boots the stack from these files — a change to them (images,
              # ports, healthchecks, services) can break the suite without touching e2e/**.
              - '.github/workflows/**'
              - '.github/actions/**'
