name: reusable-guards
# Use case: framework conformance. Runs ungated on every CI run (seconds,
# zero dependencies) so a PR that breaks the framework's own rules fails
# before expensive docker jobs burn minutes. Mark it as a required status
# check — that is what blocks the merge.
on:
  workflow_call:

jobs:
  guard:
    name: guards (framework conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/guard-framework
      - uses: ./.github/actions/actionlint
