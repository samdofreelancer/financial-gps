services:
  postgres:
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      cache_from:
        - type=gha,scope=financialgps-backend
      cache_to:
        - type=gha,scope=financialgps-backend,mode=max
    image: financialgps/backend:ci
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      cache_from:
        - type=gha,scope=financialgps-frontend
      cache_to:
        - type=gha,scope=financialgps-frontend,mode=max
    image: financialgps/frontend:ci
    restart: "no"
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
      # Same scope as backend: both share the Maven-dependency base layers.
      cache_from:
        - type=gha,scope=financialgps-backend
      cache_to:
        - type=gha,scope=financialgps-backend,mode=max
    image: financialgps/backend-test:ci
    profiles: ["test"]
    command: ./mvnw -B test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Surefire XMLs survive the container for failure telemetry (see reusable-backend).
      - ./backend-test-reports:/workspace/backend/target/surefire-reports
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
      cache_from:
        - type=gha,scope=financialgps-e2e
      cache_to:
        - type=gha,scope=financialgps-e2e,mode=max
    image: financialgps/e2e:ci
    volumes:
      - ./e2e/ci-artifacts:/workspace/e2e/ci-artifacts
    environment:
      ALLURE_RESULTS_DIR: ci-artifacts/allure-results
      ALLURE_REPORT_DIR: ci-artifacts/allure-report
      PLAYWRIGHT_OUTPUT_DIR: ci-artifacts/test-results
