services:
  postgres:
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - financialgps-pgdata:/var/lib/postgresql/data

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/backend
    command: sh scripts/dev-watch.sh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    volumes:
      - ./backend:/workspace/backend
      - backend-m2:/root/.m2

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    environment:
      API_BASE_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules

  backend-test:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /workspace/backend
    command: ./mvnw -B test
    volumes:
      - ./backend:/workspace/backend
      - backend-m2:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace/e2e
    command: sh -c "npm ci && npm test"
    environment:
      E2E_BASE_URL: http://frontend:4173
    volumes:
      - ./e2e:/workspace/e2e

volumes:
  financialgps-pgdata:
  backend-m2:
  frontend-node-modules:
