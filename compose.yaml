services:
  postgres:
    image: postgres:16-alpine
    container_name: financialgps-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: ${DB_NAME:-financialgps}
      POSTGRES_USER: ${DB_USER:-financialgps}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before running compose}"
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - financialgps-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: financialgps-backend
    restart: on-failure
    working_dir: /workspace/backend
    command: sh -c "mvn dependency:go-offline && mvn spring-boot:run -Dspring-boot.run.profiles=local"
    volumes:
      - .:/workspace
      - backend-m2:/root/.m2
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-financialgps}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-financialgps}
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before running compose}"
      SPRING_MAIN_LAZY_INITIALIZATION: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/auth/csrf >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    tty: true
    stdin_open: true

  frontend:
    image: node:20-alpine
    container_name: financialgps-frontend
    restart: on-failure
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    environment:
      API_BASE_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
    depends_on:
      backend:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  financialgps-pgdata:
  backend-m2:
  frontend-node-modules:
