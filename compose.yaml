services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financialgps}
      POSTGRES_USER: ${DB_USER:-financialgps}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before running compose}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-financialgps/backend:local}
    restart: on-failure:3
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-financialgps}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-financialgps}
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before running compose}"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_MAIN_LAZY_INITIALIZATION: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/auth/csrf >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  frontend:
    image: ${FRONTEND_IMAGE:-financialgps/frontend:local}
    restart: on-failure:3
    depends_on:
      backend:
        condition: service_healthy

  e2e:
    image: ${E2E_IMAGE:-financialgps/e2e:local}
    profiles: ["e2e"]
    init: true
    ipc: host
    environment:
      E2E_BASE_URL: http://frontend
    depends_on:
      frontend:
        condition: service_healthy
