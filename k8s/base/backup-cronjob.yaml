# Nightly logical backup: pg_dump -> gzip -> dedicated PVC, 7-day retention.
# This is the baseline DR story. For real production prefer an operator
# (CloudNativePG/Percona) with PITR, or ship dumps to object storage —
# a PVC in the same cluster is not off-site backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: financialgps
  labels:
    app.kubernetes.io/part-of: financialgps
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName: <your-class>
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: financialgps
  labels:
    app.kubernetes.io/part-of: financialgps
spec:
  schedule: "0 3 * * *" # 03:00 daily, cluster time
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: financialgps
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pgdump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: financialgps-config
                      key: DB_USER
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: financialgps-config
                      key: DB_NAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: financialgps-db
                      key: DB_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -e
                  FILE=/backups/financialgps-$(date +%Y%m%d-%H%M%S).sql.gz
                  pg_dump | gzip > "$FILE"
                  echo "backup written: $FILE ($(du -h "$FILE" | cut -f1))"
                  find /backups -name 'financialgps-*.sql.gz' -mtime +7 -delete
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backup
