# PostgreSQL 16 — single-instance StatefulSet.
# The Service MUST be named "postgres": backend's SPRING_DATASOURCE_URL
# resolves jdbc:postgresql://postgres:5432/... via in-cluster DNS.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: financialgps
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: financialgps
spec:
  clusterIP: None # headless — stable pod identity for the StatefulSet
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: financialgps
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: financialgps
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: financialgps
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70 # postgres uid/gid in postgres:16-alpine
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: financialgps-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: financialgps-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: financialgps-db
                  key: DB_PASSWORD
            # Required when mounting a volume at /var/lib/postgresql/data
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <your-class> # uncomment to pin a StorageClass
        resources:
          requests:
            storage: 5Gi
