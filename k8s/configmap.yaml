apiVersion: v1
kind: ConfigMap
metadata:
  name: financialgps-config
  namespace: financialgps
  labels:
    app.kubernetes.io/part-of: financialgps
data:
  # Mirrors compose.yaml defaults. Only non-sensitive values live here.
  DB_NAME: financialgps
  DB_USER: financialgps
  # Deliberately NOT "local": the local profile sets financial.auth.cookie.secure=false
  # (HTTP dev only). With no local profile active, cookie.secure=true applies —
  # so terminate TLS at the Ingress (see ingress.yaml).
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_MAIN_LAZY_INITIALIZATION: "false"
