# Vue SPA served by nginx (port 80). nginx.conf proxies /api/ -> http://backend:8080,
# so no API env vars are needed here — same-cluster DNS does the wiring.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: financialgps
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: financialgps
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: financialgps
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: financialgps
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: financialgps
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # NOTE: the stock nginx image binds :80 and therefore runs as root.
        # Switch to an *-unprivileged nginx base image if runAsNonRoot is required.
        - name: frontend
          image: financialgps/frontend:local # override tag via kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
